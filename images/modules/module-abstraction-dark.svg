<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc">
<title id="title">A module is an abstraction layer between developers and Terraform</title>
<desc id="desc">1. A developer fills in a short module form. 2. The module definition validates inputs, adds defaults, and maps them to Terraform variables. 3. Terraform plans and applies. 4. Resources are created in your AWS account, and outputs flow back to the module.</desc>
