name: Check social-share images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ravion/ee=github-actions-other/type=sandbox/cpu=auto/memory=auto/disk=auto/disk_cache=auto/id=${{ github.run_id }}-check-og-images-check/interruptible=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Check every page points at the Ravion OG renderer
        run: node scripts/sync-og-images.mjs --check

      - name: Check docs SEO invariants
        run: node scripts/check-docs-seo-invariants.mjs

      - name: Run script tests
        run: node --test scripts/*.test.mjs
