name: Sync module catalog

on:
  repository_dispatch:
    types:
      - module-catalog-published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-module-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ravion/ee=github-actions-other/type=sandbox/cpu=2/memory=4/disk_cache=auto/id=${{ github.run_id }}-sync-module-catalog-sync/interruptible=false
    steps:
      - uses: actions/checkout@v4

      - name: Install Ravion CLI
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://github.com/ravionhq/cli/releases/latest/download/install.sh | sh; then
              exit 0
            fi
            echo "Ravion CLI install attempt $attempt failed, retrying"
            sleep "$((attempt * 5))"
          done
          echo "Ravion CLI install failed after 5 attempts" >&2
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate catalog pages
        run: pnpm sync:module-catalog
        env:
          RAVION_API_KEY: ${{ secrets.RAVION_API_KEY }}

      - name: Sync social-share images
        run: pnpm sync:og-images

      - name: Validate docs
        run: pnpm validate

      - name: Commit and push changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain module-definitions/catalog snippets/standard-library-index.mdx)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module-definitions/catalog snippets/standard-library-index.mdx docs.json
          git commit -m "chore: sync module catalog docs"
          git push
