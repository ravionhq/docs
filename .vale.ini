# Top-level styles
StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure

# Project vocabulary
Vocab = Mintlify

# Parse MDX as Markdown to avoid fragility with JSX
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
(?<!=)\{[^}]*\}
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})

# Schema reference content is generated from the OpenAPI specs by
# scripts/sync-schema-reference.mjs, so prose rules do not apply.
[**/schema-reference/**]
BasedOnStyles =

[**/definition-schema/**]
BasedOnStyles =

# Likewise generated: the catalog pages come from the Ravion module catalog
# (scripts/sync-module-catalog.mjs) and the CLI pages from the CLI source.
[**/catalog/**]
BasedOnStyles =

[**/reference/**]
BasedOnStyles =
