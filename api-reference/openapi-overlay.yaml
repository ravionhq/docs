overlay: 1.1.0
info:
  title: Ravion docs API reference adjustments
  version: 1.0.0
extends: https://api.ravion.com/openapi.yaml
actions:
  # Module.InputProperty is a recursive 14-type union; inlined on every page that uses it,
  # it pushes those pages past 1 MB of HTML. Link to the input types reference instead.
  - target: $.components.schemas['Module.InputProperty'].oneOf
    remove: true
  - target: $.components.schemas['Module.InputProperty']
    update:
      type: object
      description: "A module input property: the same object as one entry in a module definition's `inputs` list, with its `type` field selecting the input type. See [Input types](https://www.ravion.com/docs/module-definitions/definition-schema/input-types) and [Object input types](https://www.ravion.com/docs/module-definitions/definition-schema/object-input-types) for every type and its fields."
  - target: $.components.schemas.DefaultValueDefinition.properties.schema
    update:
      description: "Schema describing the value this default accepts. It uses the same format as an entry in a module definition's `inputs` list, and its `type` field picks the input type. See [Input types](https://www.ravion.com/docs/module-definitions/definition-schema/input-types) and [Object input types](https://www.ravion.com/docs/module-definitions/definition-schema/object-input-types) for every type and its fields."
  - target: $.paths['/default-value-definitions'].post.requestBody.content['application/json'].schema.properties.data.properties.schema
    update:
      description: "Schema describing the value this default accepts. It uses the same format as an entry in a module definition's `inputs` list, and its `type` field picks the input type. See [Input types](https://www.ravion.com/docs/module-definitions/definition-schema/input-types) and [Object input types](https://www.ravion.com/docs/module-definitions/definition-schema/object-input-types) for every type and its fields."
  - target: $.paths['/default-value-definitions/{id}'].patch.requestBody.content['application/json'].schema.properties.data.properties.schema
    update:
      description: "Schema describing the value this default accepts. It uses the same format as an entry in a module definition's `inputs` list, and its `type` field picks the input type. See [Input types](https://www.ravion.com/docs/module-definitions/definition-schema/input-types) and [Object input types](https://www.ravion.com/docs/module-definitions/definition-schema/object-input-types) for every type and its fields."
  # These payloads inline full resource schemas into Describe's 19-variant union.
  # Summarize each resource to keep the Describe page below the HTML size limit.
  # Avoid inlining the API key schema into the Describe response.
  - target: $.components.schemas.LinkApiKey.allOf[0].properties.resource.allOf
    remove: true
  - target: $.components.schemas.LinkApiKey.allOf[0].properties.resource
    update:
      type: object
      description: "The resolved API key, in the same shape the API key get endpoint returns."
  # Avoid inlining the AWS account schema into the Describe response.
  - target: $.components.schemas.LinkAwsAccount.allOf[0].properties.resource.allOf
    remove: true
  - target: $.components.schemas.LinkAwsAccount.allOf[0].properties.resource
    update:
      type: object
      description: "The resolved AWS account, in the same shape the AWS account get endpoint returns."
